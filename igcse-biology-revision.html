/* ============ RENDER: NOTES ============ */
function cardHtml(c, open){
  return '<details class="card"'+(open?' open':'')+'><summary>'+c.q+'</summary><ul>'+c.a.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></details>';
}
function notesBody(){
  var st = me();
  var q = S.q.trim().toLowerCase();
  if(q){
    var out = "", n = 0;
    CH.forEach(function(c){
      var hits = c.cards.filter(function(k){ return (strip(k.q)+" "+strip(k.a.join(" "))).toLowerCase().indexOf(q) > -1; });
      if(hits.length){
        n += hits.length;
        out += '<p class="rtag">Chapter '+c.id+': '+esc(c.t)+'</p>' + hits.map(function(k){return cardHtml(k,true);}).join("");
      }
    });
    return '<p class="found">'+(n ? n+" matching "+(n===1?"card":"cards")+" across all chapters." : "No cards match “"+esc(S.q.trim())+"”. Try a shorter or different word.")+'</p>' + out;
  }
  var c = chById(S.ch);
  var read = st.read[c.id];
  return '<div class="chead"><span class="big">'+c.id+'</span><h2>'+esc(c.t)+'</h2></div>' +
    '<p class="chmeta">'+c.cards.length+' cards. Tap a question to open the answer.</p>' +
    c.cards.map(function(k){return cardHtml(k,false);}).join("") +
    '<div class="row" style="margin-top:22px"><button class="btn'+(read?' ghost':'')+'" data-a="read">'+(read?'Marked as read':'Mark chapter as read')+'</button>' +
    '<button class="btn ghost" data-a="prac-ch" data-id="'+c.id+'">Practise this chapter</button></div>';
}
function viewNotes(){
  var st = me();
  var list = CH.map(function(c){
    return '<button class="chl'+(c.id===S.ch && !S.q.trim()?' on':'')+'" data-a="chap" data-id="'+c.id+'"><span class="cn">'+c.id+'</span><span>'+esc(c.t)+'</span>'+(st.read[c.id]?'<span class="rd">Read</span>':'')+'</button>';
  }).join("");
  var sel = '<select class="chsel" id="chsel" aria-label="Choose a chapter">'+CH.map(function(c){
    return '<option value="'+c.id+'"'+(c.id===S.ch?' selected':'')+'>'+c.id+'. '+esc(c.t)+'</option>';
  }).join("")+'</select>';
  return '<div class="ngrid"><aside class="side" aria-label="Chapters">'+list+'</aside><div>' +
    sel +
    '<input class="search" id="search" type="search" placeholder="Search all notes, e.g. osmosis" value="'+esc(S.q)+'" aria-label="Search all notes">' +
    '<div id="nbody">'+notesBody()+'</div></div></div>';
}

/* ============ RENDER: PRACTICE ============ */
function qPool(sel,diff){
  return QB.map(function(q,i){return {i:i,c:q[0],d:q[1]};}).filter(function(x){
    return sel.indexOf(x.c) > -1 && (!diff || x.d === diff);
  });
}
function viewPracSetup(){
  var P = S.prac;
  var chips = CH.map(function(c){
    return '<button class="chip" data-a="pc" data-id="'+c.id+'" aria-pressed="'+(P.sel.indexOf(c.id)>-1)+'">'+c.id+'. '+esc(c.s)+'</button>';
  }).join("");
  var pool = qPool(P.sel,P.diff).length;
  var seg = function(act,cur,items){
    return '<div class="seg" role="group">'+items.map(function(it){
      return '<button data-a="'+act+'" data-v="'+it[0]+'" aria-pressed="'+(String(cur)===String(it[0]))+'">'+it[1]+'</button>';
    }).join("")+'</div>';
  };
  var hasData = me().attempts.length >= 6;
  return '<h1 style="font-size:clamp(28px,4vw,40px)">Practice</h1><p class="lede" style="margin:8px 0 22px">Pick chapters, a level and a length. Every answer counts towards your report.</p>' +
    '<div class="panel"><h3>Chapters</h3><div class="chips">'+chips+'</div>' +
    '<div class="row" style="margin-top:12px"><button class="linkbtn" data-a="pall">Select all</button><button class="linkbtn" data-a="pnone">Clear</button>'+(hasData?'<button class="linkbtn" data-a="pweak">Pick my 3 weakest chapters</button>':'')+'</div></div>' +
    '<div class="two"><div class="panel"><h3>Level</h3>'+seg("pd",P.diff,[[0,"All"],[1,"Easy"],[2,"Medium"],[3,"Hard"]])+'</div>' +
    '<div class="panel"><h3>Number of questions</h3>'+seg("pn",P.count,[[10,"10"],[20,"20"],[0,"All"]])+'</div></div>' +
    '<div class="row"><button class="btn red" data-a="begin"'+(pool?'':' disabled')+'>Start practice</button><span class="note" style="margin:0">'+(pool?pool+" question"+(pool===1?"":"s")+" match your choices.":"No questions match. Select at least one chapter or change the level.")+'</span></div>';
}
function viewPracRun(){
  var P = S.prac, it = P.queue[P.i], q = QB[it.qi];
  var letters = ["A","B","C","D"];
  var dl = ["","Easy","Medium","Hard"][q[1]];
  var ans = P.answered;
  var opts = it.order.map(function(oi,pos){
    var cls = "opt";
    if(ans){ if(oi===q[4]) cls += " good"; else if(oi===P.pick) cls += " bad"; }
    return '<button class="'+cls+'" data-a="opt" data-i="'+oi+'"'+(ans?' disabled':'')+'><span class="k">'+letters[pos]+'</span><span>'+q[3][oi]+'</span></button>';
  }).join("");
  var fb = "";
  if(ans){
    var ok = P.pick === q[4];
    fb = '<div class="fb '+(ok?'good':'bad')+'" role="status"><b>'+(ok?'Correct.':'Not quite. The answer is: '+strip(q[3][q[4]]))+'</b><p>'+q[5]+'</p>' +
      '<div class="row"><button class="btn" data-a="next">'+(P.i+1>=P.queue.length?'See results':'Next question')+'</button>' +
      '<button class="linkbtn" data-a="goto-notes" data-id="'+q[0]+'">Review chapter '+q[0]+' notes</button></div></div>';
  }
  return '<div class="qmeta"><span>Question '+(P.i+1)+' of '+P.queue.length+'</span><span>Chapter '+q[0]+': '+esc(chById(q[0]).s)+' · '+dl+'</span></div>' +
    '<div class="prog"><i style="width:'+Math.round(100*(P.i+(ans?1:0))/P.queue.length)+'%"></i></div>' +
    '<h2 class="qtext">'+q[2]+'</h2><div class="opts" role="group" aria-label="Answer choices">'+opts+'</div>'+fb;
}
function viewPracDone(){
  var P = S.prac;
  var ok = P.results.filter(function(r){return r.ok;}).length, n = P.results.length;
  var per = {};
  P.results.forEach(function(r){ var c = QB[r.qi][0]; per[c] = per[c] || {n:0,ok:0}; per[c].n++; if(r.ok) per[c].ok++; });
  var rows = Object.keys(per).map(function(c){
    return '<tr><td>'+c+'. '+esc(chById(+c).t)+'</td><td class="num">'+per[c].ok+' / '+per[c].n+'</td></tr>';
  }).join("");
  var missed = P.results.filter(function(r){return !r.ok;}).map(function(r){
    var q = QB[r.qi];
    return '<div class="miss"><b>'+q[2]+'</b><p>Answer: '+q[3][q[4]]+'. '+q[5]+'</p></div>';
  }).join("");
  return '<h1 style="font-size:clamp(28px,4vw,40px)">Practice complete</h1>' +
    '<div class="row" style="margin:18px 0 8px;align-items:flex-end;gap:18px"><span class="score">'+Math.round(100*ok/n)+'%</span><span class="lede" style="margin-bottom:6px">'+ok+' of '+n+' correct</span></div>' +
    '<div class="row" style="margin:18px 0 26px"><button class="btn red" data-a="nav" data-v="report">See my report</button><button class="btn ghost" data-a="again">Practise again</button></div>' +
    '<h3 style="margin-bottom:10px">By chapter</h3><div class="tbl" style="max-width:560px"><table style="min-width:0"><tbody>'+rows+'</tbody></table></div>' +
    (missed ? '<h3 style="margin:28px 0 4px">Questions to revisit</h3>'+missed : '<p class="lede" style="margin-top:24px">No mistakes this time. Try a harder level.</p>');
}
function viewPractice(){
  if(!S.prac) S.prac = {stage:"setup", sel:CH.map(function(c){return c.id;}), diff:0, count:10};
  if(S.prac.stage==="run") return viewPracRun();
  if(S.prac.stage==="done") return viewPracDone();
  return viewPracSetup();
}

/* ============ RENDER: REPORT ============ */
function radar(vals){
  var cx=230, cy=165, R=98, n=vals.length;
  function pt(i,r){ var a=-Math.PI/2+2*Math.PI*i/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function f(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }
  var s = '<svg viewBox="0 0 460 330" role="img" aria-label="Radar chart of mastery in each topic area">';
  [25,50,75,100].forEach(function(p){
    s += '<polygon class="rg" points="'+vals.map(function(_,i){return f(pt(i,R*p/100));}).join(" ")+'"/>';
  });
  vals.forEach(function(_,i){ var p=pt(i,R); s += '<line class="rg" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; });
  s += '<polygon class="ra" points="'+vals.map(function(v,i){return f(pt(i,R*(v===null?0:v)/100));}).join(" ")+'"/>';
  vals.forEach(function(v,i){
    var p = pt(i,R*(v===null?0:v)/100);
    s += '<circle class="rd2'+(v===null?' empty':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5"/>';
    var lp = pt(i,R+16);
    var anchor = Math.abs(lp[0]-cx)<10 ? "middle" : (lp[0]>cx ? "start" : "end");
    var y = lp[1] + (lp[1] > cy+5 ? 12 : (lp[1] < cy-5 ? -14 : -2));
    s += '<text class="rl" text-anchor="'+anchor+'" x="'+lp[0].toFixed(1)+'" y="'+y.toFixed(1)+'">'+THEMES[i].n+'</text>' +
         '<text class="rl2" text-anchor="'+anchor+'" x="'+lp[0].toFixed(1)+'" y="'+(y+14).toFixed(1)+'">'+(v===null?"not tested":v+"%")+'</text>';
  });
  return s + '</svg>';
}
function reportData(st){
  var A = st.attempts, r = stats(A);
  var overallP = pct(r.all);
  var ov = level(overallP, r.all.n, 10);
  var rows = CH.map(function(c){
    var o = r.byCh[c.id], p = pct(o);
    return {c:c, o:o, p:p, lv:level(p,o.n,2)};
  });
  var tested = rows.filter(function(x){return x.o.n>=2;});
  var weak = tested.filter(function(x){return x.p<70;}).sort(function(a,b){return a.p-b.p;}).slice(0,3);
  var strong = tested.filter(function(x){return x.p>=70;}).sort(function(a,b){return b.p-a.p;}).slice(0,3);
  var untested = rows.filter(function(x){return x.o.n===0;});
  var trend = null;
  if(A.length >= 20){
    var last = A.slice(-10), prev = A.slice(0,-10);
    var la = last.filter(function(a){return a.ok;}).length/last.length*100;
    var pa = prev.filter(function(a){return a.ok;}).length/prev.length*100;
    var d = Math.round(la-pa);
    trend = {last:Math.round(la), prev:Math.round(pa), d:d};
  }
  var recs = [];
  var e = acc(r.byD[1]), m = acc(r.byD[2]), h = acc(r.byD[3]);
  if(r.all.n >= 10){
    if(e!==null && e < 60) recs.push("Your easy-question accuracy is "+e+"%, so start by learning the core definitions and key terms in the notes before moving to harder questions.");
    else if(e!==null && h!==null && r.byD[3].n>=3 && e-h >= 25) recs.push("You score "+e+"% on easy questions but "+h+"% on hard ones. You know the facts but lose marks applying them. Practise explaining why things happen, not just what happens.");
    if(r.fastWrong >= 3) recs.push("You gave "+r.fastWrong+" wrong answers in under 5 seconds, which suggests guessing. Read every option before choosing.");
    if(r.badN>=3 && r.okN>=3 && (r.badMs/r.badN) > 1.6*(r.okMs/r.okN)) recs.push("Wrong answers take you much longer than correct ones. When you hesitate, that topic needs another read through the notes.");
  }
  weak.forEach(function(x){ recs.push("Revise chapter "+x.c.id+", “"+x.c.t+"” ("+x.p+"%). Read the notes, then retry its questions at Easy level first."); });
  if(untested.length) recs.push("You haven't tried "+untested.length+" of 22 chapters yet. Untested chapters could be hiding weak spots.");
  var readN = Object.keys(st.read).filter(function(k){return st.read[k];}).length;
  var unread = rows.filter(function(x){return x.o.n>0 && !st.read[x.c.id] && x.p!==null && x.p<70;});
  if(unread.length) recs.push("You have practised "+unread.map(function(x){return "chapter "+x.c.id;}).slice(0,3).join(", ")+" without marking the notes as read. Reading first usually lifts the score.");
  if(!recs.length && r.all.n>=10) recs.push("Strong all round. Move to Hard questions and mixed-chapter sets to stay sharp.");
  var sessions = {};
  A.forEach(function(a){ var s = sessions[a.s] = sessions[a.s] || {t:a.t, n:0, ok:0}; s.n++; if(a.ok) s.ok++; s.t = Math.max(s.t,a.t); });
  var sess = Object.keys(sessions).map(function(k){return sessions[k];}).sort(function(a,b){return b.t-a.t;}).slice(0,8);
  return {r:r, overallP:overallP, ov:ov, rows:rows, weak:weak, strong:strong, untested:untested, trend:trend, recs:recs, readN:readN, sess:sess, e:e, m:m, h:h};
}
function viewReport(){
  var st = me();
  if(!st.attempts.length){
    return '<div class="empty"><h2>No answers yet, '+esc(st.name)+'</h2><p>Your report builds as you answer practice questions. It shows your level in every chapter and topic area, your speed, and what to revise next.</p><button class="btn red" data-a="nav" data-v="practice">Start practice</button></div>';
  }
  var D = reportData(st), r = D.r;
  var today = new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
  var themeVals = r.byTh.map(function(o){ return o.n ? pct(o) : null; });
  var lbCls = "l-"+D.ov.k;
  var summaryBox = '<div class="lvlbox '+lbCls+'"><div>Overall level (weighted by difficulty)</div><div class="lv">'+(D.ov.k==="na" ? "Keep going" : D.ov.t)+'</div>' +
    (D.ov.k==="na" ? '<div>Answer at least 10 questions to get an overall level. You have answered '+r.all.n+'.</div>' :
      '<div>Mastery score '+D.overallP+'%. Indicative grade band: <b>'+grade(D.overallP)+'</b>.</div>') +
    '<div class="nums"><div><b>'+r.all.n+'</b><span>questions answered</span></div><div><b>'+acc(r.all)+'%</b><span>answered correctly</span></div><div><b>'+secs(r.all.ms,r.all.n)+'</b><span>average time</span></div><div><b>'+D.readN+'/22</b><span>chapters read</span></div></div></div>';
  var dbars = [[1,"Easy"],[2,"Medium"],[3,"Hard"]].map(function(x){
    var o = r.byD[x[0]], a = acc(o);
    return '<div class="dbar"><span>'+x[1]+'</span><span class="track"><i style="width:'+(a||0)+'%"></i></span><span>'+(o.n? a+"% ("+o.ok+"/"+o.n+")" : "no answers")+'</span></div>';
  }).join("");
  var trs = D.rows.map(function(x){
    return '<tr><td>'+x.c.id+'. '+esc(x.c.t)+'</td><td class="num">'+(x.o.n? x.o.ok+" / "+x.o.n : "–")+'</td>' +
      '<td class="num">'+(x.o.n? '<span class="minibar"><i style="width:'+x.p+'%"></i></span>'+x.p+'%' : "–")+'</td>' +
      '<td><span class="badge l-'+x.lv.k+'">'+x.lv.t+'</span></td><td class="num">'+secs(x.o.ms,x.o.n)+'</td>' +
      '<td class="noprint"><button class="linkbtn" data-a="goto-notes" data-id="'+x.c.id+'">Notes</button></td></tr>';
  }).join("");
  var li = function(arr,f){ return arr.length ? '<ul class="list">'+arr.map(f).join("")+'</ul>' : '<p class="note" style="margin:0">Not enough data yet (2 or more answers per chapter needed).</p>'; };
  var trendTxt = D.trend ? (D.trend.d>=8 ? "Improving: your last 10 answers were "+D.trend.last+"% correct against "+D.trend.prev+"% before." :
                            D.trend.d<=-8 ? "Slipping: your last 10 answers were "+D.trend.last+"% correct against "+D.trend.prev+"% before. Take a break or go back to the notes." :
                            "Steady: your last 10 answers were "+D.trend.last+"% correct, close to your earlier "+D.trend.prev+"%.") : "Answer at least 20 questions to see a trend.";
  var sessRows = D.sess.map(function(s){
    return '<tr><td>'+new Date(s.t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+'</td><td class="num">'+s.ok+' / '+s.n+'</td><td class="num">'+Math.round(100*s.ok/s.n)+'%</td></tr>';
  }).join("");
  return '<div class="rep-head"><div><h1 style="font-size:clamp(28px,4vw,42px)">Progress report</h1><p class="lede" style="margin-top:6px">Student: <b style="color:var(--ink)">'+esc(st.name)+'</b></p></div><div class="when">'+today+'</div></div>' +
    '<div class="summary">'+summaryBox+'<div class="radarwrap">'+radar(themeVals)+'</div></div>' +
    '<div class="row noprint"><button class="btn" data-a="print">Print or save as PDF</button><button class="btn ghost" data-a="copy">'+(S.copied?"Copied":"Copy report as text")+'</button><button class="btn ghost" data-a="nav" data-v="practice">Keep practising</button></div>' +
    '<div class="sec"><h2>What to do next</h2>'+(D.recs.length? D.recs.map(function(t){return '<div class="rec">'+esc(t)+'</div>';}).join("") : '<p class="note">Answer a few more questions to get tailored advice.</p>')+'</div>' +
    '<div class="sec two"><div><h2>Strongest chapters</h2>'+li(D.strong,function(x){return '<li>'+x.c.id+'. '+esc(x.c.t)+' ('+x.p+'%)</li>';})+'</div>' +
    '<div><h2>Needs attention</h2>'+li(D.weak,function(x){return '<li>'+x.c.id+'. '+esc(x.c.t)+' ('+x.p+'%)</li>';})+'</div></div>' +
    '<div class="sec two"><div><h2>By difficulty</h2><div class="dbars">'+dbars+'</div><p class="note">Easy questions test recall, hard ones test explanation and application.</p></div>' +
    '<div><h2>Speed and trend</h2><ul class="list"><li>Average time on correct answers: '+secs(r.okMs,r.okN)+'</li><li>Average time on wrong answers: '+secs(r.badMs,r.badN)+'</li><li>Wrong answers given in under 5 seconds: '+r.fastWrong+'</li><li>'+trendTxt+'</li></ul></div></div>' +
    '<div class="sec"><h2>Chapter by chapter</h2><div class="tbl"><table><thead><tr><th>Chapter</th><th>Correct</th><th>Mastery</th><th>Level</th><th>Avg time</th><th class="noprint"></th></tr></thead><tbody>'+trs+'</tbody></table></div>' +
    '<p class="note">Mastery weights hard questions more than easy ones (easy 1, medium 1.5, hard 2). A chapter needs at least 2 answers to get a level. Levels: Excellent 85% and above, Strong 70–84%, Developing 50–69%, Needs work below 50%. The grade band is a rough guide from practice only and is not a prediction of your exam result.</p></div>' +
    '<div class="sec"><h2>Recent sessions</h2><div class="tbl" style="max-width:520px"><table style="min-width:0"><thead><tr><th>Date</th><th>Score</th><th>Percent</th></tr></thead><tbody>'+sessRows+'</tbody></table></div></div>' +
    '<div class="sec noprint"><h2>Your data</h2><p class="note" style="margin:0 0 10px">Results are saved in this browser on this device only. Clearing browser data or using another device starts fresh.</p>' +
    '<button class="btn ghost" data-a="reset">'+(S.confirmReset?"Press again to erase all my answers":"Erase my answers")+'</button></div>';
}
function reportText(){
  var st = me(), D = reportData(st), r = D.r, L = [];
  L.push("IGCSE Biology progress report");
  L.push("Student: "+st.name+"   Date: "+new Date().toLocaleDateString());
  L.push("");
  L.push("Overall: "+(D.ov.k==="na" ? "not enough answers yet" : D.ov.t+" ("+D.overallP+"%, indicative grade band "+grade(D.overallP)+")"));
  L.push("Answered: "+r.all.n+"   Correct: "+acc(r.all)+"%   Average time: "+secs(r.all.ms,r.all.n)+"   Chapters read: "+D.readN+"/22");
  L.push("By difficulty: Easy "+(acc(r.byD[1])===null?"-":acc(r.byD[1])+"%")+", Medium "+(acc(r.byD[2])===null?"-":acc(r.byD[2])+"%")+", Hard "+(acc(r.byD[3])===null?"-":acc(r.byD[3])+"%"));
  L.push("");
  L.push("Chapters:");
  D.rows.forEach(function(x){ L.push("  "+x.c.id+". "+x.c.t+": "+(x.o.n? x.p+"% ("+x.o.ok+"/"+x.o.n+"), "+x.lv.t : "not tested")); });
  L.push("");
  L.push("Next steps:");
  D.recs.forEach(function(t){ L.push("  - "+t); });
  return L.join("\n");
}

/* ============ MAIN RENDER ============ */
function render(){
  var st = me();
  if(!st) S.view = "gate";
  renderTop();
  var h;
  if(S.view==="gate") h = viewGate();
  else if(S.view==="notes") h = viewNotes();
  else if(S.view==="practice") h = viewPractice();
  else h = viewReport();
  $app.innerHTML = h;
  if(S.view==="gate"){ var nm = document.getElementById("nm"); if(nm && !Object.keys(DB.students).length) nm.focus(); }
}

/* ============ ACTIONS ============ */
function startStudent(raw){
  var name = raw.trim().replace(/\s+/g," ").slice(0,40);
  if(!name) return;
  var key = name.toLowerCase();
  if(!DB.students[key]) DB.students[key] = {name:name, created:Date.now(), attempts:[], read:{}};
  DB.current = key; save();
  S.view = "notes"; S.prac = null; S.q = ""; S.ch = 1;
  render(); window.scrollTo(0,0);
}
function beginPractice(){
  var P = S.prac;
  var pool = shuffle(qPool(P.sel,P.diff));
  if(P.count) pool = pool.slice(0,P.count);
  if(!pool.length) return;
  P.queue = pool.map(function(x){ return {qi:x.i, order:shuffle([0,1,2,3])}; });
  P.i = 0; P.stage = "run"; P.answered = false; P.pick = null; P.results = [];
  P.sid = "s"+Date.now(); P.t0 = Date.now();
  render(); window.scrollTo(0,0);
}
function answer(oi){
  var P = S.prac; if(P.answered) return;
  var it = P.queue[P.i], q = QB[it.qi];
  var ok = oi === q[4];
  P.answered = true; P.pick = oi;
  P.results.push({qi:it.qi, ok:ok});
  me().attempts.push({t:Date.now(), s:P.sid, c:q[0], d:q[1], q:it.qi, ok:ok, ms:Date.now()-P.t0, pick:oi});
  save(); render();
}
function act(a,b){
  var st = me();
  switch(a){
    case "pick": startStudent(DB.students[b.dataset.k].name); break;
    case "switch": DB.current = null; save(); S.view="gate"; S.prac=null; render(); break;
    case "nav": S.view = b.dataset.v; S.confirmReset=false; if(S.view==="practice" && S.prac && S.prac.stage==="done") S.prac=null; render(); window.scrollTo(0,0); break;
    case "chap": S.ch = +b.dataset.id; S.q=""; render(); window.scrollTo(0,0); break;
    case "read": st.read[S.ch] = !st.read[S.ch]; save(); render(); break;
    case "goto-notes": S.ch = +b.dataset.id; S.q=""; S.view="notes"; if(S.prac && S.prac.stage==="run"){ /* leave quiz state intact */ } render(); window.scrollTo(0,0); break;
    case "prac-ch": S.prac = {stage:"setup", sel:[+b.dataset.id], diff:0, count:10}; S.view="practice"; render(); window.scrollTo(0,0); break;
    case "pc": var id=+b.dataset.id, ix=S.prac.sel.indexOf(id); if(ix>-1) S.prac.sel.splice(ix,1); else S.prac.sel.push(id); render(); break;
    case "pall": S.prac.sel = CH.map(function(c){return c.id;}); render(); break;
    case "pnone": S.prac.sel = []; render(); break;
    case "pweak":
      var r = stats(st.attempts);
      var w = CH.filter(function(c){return r.byCh[c.id].n>0;}).map(function(c){return {id:c.id,p:pct(r.byCh[c.id])};}).sort(function(a,b){return a.p-b.p;}).slice(0,3).map(function(x){return x.id;});
      var unt = CH.filter(function(c){return r.byCh[c.id].n===0;}).map(function(c){return c.id;});
      while(w.length<3 && unt.length) w.push(unt.shift());
      S.prac.sel = w; render(); break;
    case "pd": S.prac.diff = +b.dataset.v; render(); break;
    case "pn": S.prac.count = +b.dataset.v; render(); break;
    case "begin": beginPractice(); break;
    case "opt": answer(+b.dataset.i); break;
    case "next":
      var P = S.prac;
      if(P.i+1 >= P.queue.length){ P.stage = "done"; }
      else { P.i++; P.answered=false; P.pick=null; P.t0=Date.now(); }
      render(); window.scrollTo(0,0); break;
    case "again": S.prac = null; render(); window.scrollTo(0,0); break;
    case "print": try{ window.print(); }catch(e){} break;
    case "copy":
      var txt = reportText();
      var done = function(){ S.copied = true; render(); setTimeout(function(){ S.copied=false; if(S.view==="report") render(); },2000); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt); done(); }); }
        else { fallbackCopy(txt); done(); }
      }catch(e){ fallbackCopy(txt); done(); }
      break;
    case "reset":
      if(!S.confirmReset){ S.confirmReset = true; render(); }
      else { st.attempts = []; st.read = {}; S.confirmReset = false; save(); render(); window.scrollTo(0,0); }
      break;
  }
}
function fallbackCopy(t){
  try{
    var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }catch(e){}
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-a]");
  if(b) act(b.dataset.a, b);
});
document.addEventListener("submit", function(e){
  if(e.target.id === "nameform"){ e.preventDefault(); startStudent(document.getElementById("nm").value); }
});
document.addEventListener("input", function(e){
  if(e.target.id === "search"){
    S.q = e.target.value;
    document.getElementById("nbody").innerHTML = notesBody();
    var items = document.querySelectorAll(".chl");
    for(var i=0;i<items.length;i++){ items[i].classList.remove("on"); }
    if(!S.q.trim()){ render(); var s=document.getElementById("search"); if(s){ s.focus(); s.setSelectionRange(0,0); } }
  }
});
document.addEventListener("change", function(e){
  if(e.target.id === "chsel"){ S.ch = +e.target.value; S.q=""; render(); }
});
document.addEventListener("keydown", function(e){
  if(S.view==="practice" && S.prac && S.prac.stage==="run" && !S.prac.answered && /^[1-4]$/.test(e.key) && !e.metaKey && !e.ctrlKey){
    var it = S.prac.queue[S.prac.i];
    answer(it.order[+e.key-1]);
  }
});

load();
renderWarn();
if(DB.current && DB.students[DB.current]) S.view = "notes";
render();
</script>
